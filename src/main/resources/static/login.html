<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - Anime Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        Anime Review
    </div>
</header>

<main class="auth-main">
    <section class="auth-box">
        <h1>ログイン</h1>

        <input type="email" id="loginEmail" placeholder="メールアドレス">
        <input type="password" id="loginPassword" placeholder="パスワード">

        <button id="loginBtn" class="auth-btn">ログイン</button>

        <div class="auth-links">
            <a href="/join.html">会員登録</a>
            <span>|</span>
            <a href="/find-password.html">パスワードをお忘れの方</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
