<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Anime Detail</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="header">

        <div class="logo" onclick="location.href='/index.html'">
            Anime Review
        </div>

        <div class="header-right">
            <nav class="nav" id="navMenu">
                <a href="#" onclick="needLogin()">マイページ</a>
            </nav>

            <div class="auth-area" id="authArea">
                <button class="login-btn" onclick="location.href='/login.html'">ログイン</button>
            </div>
        </div>

    </header>

    <main class="detail-main">

        <button class="back-btn" onclick="location.href='/index.html'">
            ← 一覧へ戻る
        </button>

        <section class="detail-card">

            <div class="detail-image-box">
                <img id="detailImage" src="https://placehold.co/350x500" alt="anime">
            </div>

            <div class="detail-info-box">
                <div id="detailGenre" class="detail-genre">ジャンル</div>

                <div class="detail-title-row">
                    <h1 id="detailTitle" class="detail-title">アニメタイトル</h1>

                    <button id="bookmarkBtn" class="bookmark-btn">
                        ♡ ブックマーク
                    </button>
                </div>

                <!-- 평균 별점 -->
                <div id="detailRating" class="detail-rating">
                    ⭐ レビューはまだありません
                </div>

                <div class="detail-meta">
                    <span>制作会社</span>
                    <strong id="detailStudio">-</strong>
                </div>

                <div class="detail-meta">
                    <span>登録日</span>
                    <strong id="detailCreatedAt">-</strong>
                </div>

                <div class="detail-description-box">
                    <h3>作品紹介</h3>
                    <p id="detailDescription">
                        作品説明が表示されます。
                    </p>
                </div>
            </div>

        </section>

        <section class="review-section">

            <div class="review-header">
                <h2>レビュー</h2>
                <span id="reviewCount">0件</span>
            </div>

            <div class="review-write-box">
                <h3>レビューを書く</h3>

                <div class="review-form-row">
                    <label>評価</label>

                    <div class="star-rating" id="starRating">
                        <span class="star" data-value="1">☆</span>
                        <span class="star" data-value="2">☆</span>
                        <span class="star" data-value="3">☆</span>
                        <span class="star" data-value="4">☆</span>
                        <span class="star" data-value="5">☆</span>
                    </div>
                </div>

                <textarea id="reviewContent" placeholder="ログイン後、レビューを投稿できます。"></textarea>

                <button id="reviewSubmitBtn" class="review-submit-btn">
                    レビューを投稿
                </button>
            </div>

            <div id="reviewList" class="review-list">
                <!-- 리뷰 목록 JS 출력 -->
            </div>

        </section>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/detail.js"></script>
</body>
</html>
