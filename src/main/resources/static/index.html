<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Anime Review</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- =========================
         상단 메뉴
    ========================= -->
    <header class="header">

        <!-- 로고 클릭 시 메인으로 이동 -->
        <div class="logo" onclick="location.href='/index.html'">
            Anime Review
        </div>

        <div class="header-right">

            <!-- 로그인 상태에 따라 common.js에서 변경 -->
            <nav class="nav" id="navMenu">
                <a href="#" onclick="needLogin()">マイページ</a>
            </nav>

            <!-- 로그인 / 로그아웃 영역 -->
            <div class="auth-area" id="authArea">
                <button class="login-btn" onclick="location.href='/login.html'">
                    ログイン
                </button>
            </div>

        </div>

    </header>

    <!-- =========================
         메인 영역
    ========================= -->
    <main class="main">

        <!-- 제목 -->
        <section class="main-title">
            <h1>アニメレビュー</h1>
            <p>好きなアニメを探して、レビューを投稿してみましょう。</p>
        </section>

        <!-- =========================
             검색창
        ========================= -->
        <section class="search-section">

            <div class="search-box">

                <!-- 검색 입력창 -->
                <input type="text" id="searchInput" placeholder="アニメタイトルを検索">

                <!-- 검색 버튼 -->
                <button id="searchBtn">検索</button>

                <!-- 검색 자동완성 목록 -->
                <div class="search-suggestion-box" id="searchSuggestionBox">
                    <!-- 검색어 입력 시 JS로 자동완성 목록 출력 -->
                </div>

            </div>

        </section>

        <!-- =========================
             장르 탭
        ========================= -->
        <section class="genre-tabs">
            <button class="genre-btn active" data-genre="all">すべて</button>
            <button class="genre-btn" data-genre="1">アクション</button>
            <button class="genre-btn" data-genre="2">ファンタジー</button>
            <button class="genre-btn" data-genre="3">コメディ</button>
        </section>

        <!-- =========================
             정렬 버튼
        ========================= -->
        <section class="sort-tabs">
            <button class="sort-btn active" data-sort="default">標準順</button>
            <button class="sort-btn" data-sort="rating">評価順</button>
            <button class="sort-btn" data-sort="review">レビュー数順</button>
        </section>

        <!-- =========================
             애니 목록
        ========================= -->
        <section class="anime-grid" id="animeGrid"></section>

        <!-- =========================
             페이지 버튼
        ========================= -->
        <section class="pagination" id="animePagination"></section>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
