<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイページ - Anime Review</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- =========================
         상단 메뉴
    ========================= -->
    <header class="header">

        <!-- 로고 클릭 시 메인으로 이동 -->
        <div class="logo" onclick="location.href='/index.html'">
            Anime Review
        </div>

        <div class="header-right">

            <!-- 로그인 상태에 따라 common.js에서 변경 -->
            <nav class="nav" id="navMenu">
                <a href="#" onclick="needLogin()">マイページ</a>
            </nav>

            <!-- 로그인 / 로그아웃 영역 -->
            <div class="auth-area" id="authArea">
                <button class="login-btn" onclick="location.href='/login.html'">
                    ログイン
                </button>
            </div>

        </div>

    </header>

    <!-- =========================
         마이페이지 메인 영역
    ========================= -->
    <main class="mypage-main">

        <!-- 페이지 제목 -->
        <section class="mypage-title">
            <h1>マイページ</h1>
            <p>自分の活動履歴を確認できます。</p>
        </section>

        <!-- =========================
             내 정보
        ========================= -->
        <section class="mypage-card">
            <div class="mypage-card-header">
                <h2>プロフィール</h2>
            </div>

            <div class="mypage-profile" id="myProfile">
                <!-- 내 정보 JS 출력 -->
            </div>
        </section>

        <!-- =========================
             내가 북마크한 애니
        ========================= -->
        <section class="mypage-card">
            <div class="mypage-card-header">
                <h2>ブックマーク一覧</h2>
                <span id="myBookmarkCount">0件</span>
            </div>

            <div class="mypage-anime-grid" id="myBookmarkList">
                <!-- 북마크 목록 JS 출력 -->
            </div>

            <!-- 북마크 페이지 버튼 -->
            <div class="pagination" id="myBookmarkPagination"></div>
        </section>

        <!-- =========================
             내가 쓴 리뷰
        ========================= -->
        <section class="mypage-card">
            <div class="mypage-card-header">
                <h2>レビュー一覧</h2>
                <span id="myReviewCount">0件</span>
            </div>

            <div class="mypage-list" id="myReviewList">
                <!-- 리뷰 목록 JS 출력 -->
            </div>

            <!-- 리뷰 페이지 버튼 -->
            <div class="pagination" id="myReviewPagination"></div>
        </section>

        <!-- =========================
             내가 쓴 댓글
        ========================= -->
        <section class="mypage-card">
            <div class="mypage-card-header">
                <h2>コメント一覧</h2>
                <span id="myCommentCount">0件</span>
            </div>

            <div class="mypage-list" id="myCommentList">
                <!-- 댓글 목록 JS 출력 -->
            </div>

            <!-- 댓글 페이지 버튼 -->
            <div class="pagination" id="myCommentPagination"></div>
        </section>

        <!-- =========================
             비밀번호 변경
        ========================= -->
        <section class="mypage-card">
            <div class="mypage-card-header">
                <h2>パスワード変更</h2>
            </div>

            <div class="mypage-password-form">

                <!-- 현재 비밀번호 -->
                <input type="password" id="currentPassword" placeholder="現在のパスワード">

                <!-- 새 비밀번호 -->
                <input type="password" id="newPassword" placeholder="新しいパスワード">

                <!-- 새 비밀번호 확인 -->
                <input type="password" id="newPasswordCheck" placeholder="新しいパスワード確認">

                <!-- 비밀번호 변경 버튼 -->
                <button type="button" id="changePasswordBtn" class="auth-btn">
                    パスワードを変更
                </button>

                <!-- 결과 메시지 -->
                <div id="passwordChangeResult" class="find-result"></div>

            </div>
        </section>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/mypage.js"></script>
</body>
</html>
