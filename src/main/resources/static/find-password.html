<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - Anime Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        Anime Review
    </div>
</header>

<main class="auth-main">
    <section class="auth-box">
        <h1>비밀번호 찾기</h1>

        <input type="text" id="findName" placeholder="이름">
        <input type="text" id="findPhone" placeholder="전화번호">
        <input type="email" id="findEmail" placeholder="이메일">

        <button id="findPasswordBtn" class="auth-btn">비밀번호 재설정</button>

        <div id="findPasswordResult" class="find-result"></div>

        <div class="auth-links">
            <a href="/login.html">로그인으로 돌아가기</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
