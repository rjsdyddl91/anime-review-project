<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>임시 비밀번호 발급 - Anime Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        Anime Review
    </div>
</header>

<main class="auth-main">
    <section class="auth-box">

        <!-- 페이지 제목 -->
        <h1>임시 비밀번호 발급</h1>

        <!-- 안내 문구 -->
        <p class="auth-description">
            가입한 이름, 전화번호, 이메일을 입력하면<br>
            임시 비밀번호가 이메일로 발송됩니다.
        </p>

        <!-- 이름 -->
        <input type="text" id="findName" placeholder="이름">

        <!-- 전화번호 -->
        <input type="text" id="findPhone" placeholder="전화번호">

        <!-- 이메일 -->
        <input type="email" id="findEmail" placeholder="이메일">

        <!-- 임시 비밀번호 발급 버튼 -->
        <button id="findPasswordBtn" class="auth-btn">
            임시 비밀번호 발급
        </button>

        <!-- 결과 메시지 -->
        <div id="findPasswordResult" class="find-result"></div>

        <div class="auth-links">
            <a href="/login.html">로그인으로 돌아가기</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
