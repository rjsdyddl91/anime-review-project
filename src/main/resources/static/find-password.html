<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>仮パスワード発行 - Anime Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        Anime Review
    </div>
</header>

<main class="auth-main">
    <section class="auth-box">

        <!-- 페이지 제목 -->
        <h1>仮パスワード発行</h1>

        <!-- 안내 문구 -->
        <p class="auth-description">
            登録した名前、電話番号、メールアドレスを入力すると<br>
            仮パスワードがメールで送信されます。
        </p>

        <!-- 이름 -->
        <input type="text" id="findName" placeholder="名前">

        <!-- 전화번호 -->
        <input type="text" id="findPhone" placeholder="電話番号">

        <!-- 이메일 -->
        <input type="email" id="findEmail" placeholder="メールアドレス">

        <!-- 임시 비밀번호 발급 버튼 -->
        <button id="findPasswordBtn" class="auth-btn">
            仮パスワードを発行
        </button>

        <!-- 결과 메시지 -->
        <div id="findPasswordResult" class="find-result"></div>

        <div class="auth-links">
            <a href="/login.html">ログイン画面へ戻る</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
