<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員登録 - Anime Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo" onclick="location.href='/index.html'">
        Anime Review
    </div>
</header>

<main class="auth-main">
    <section class="auth-box">
        <h1>会員登録</h1>

        <!-- 이름 -->
        <input type="text" id="joinName" placeholder="名前">

        <!-- 전화번호 -->
        <input type="text" id="joinPhone" placeholder="電話番号">

        <!-- 이메일 -->
        <input type="email" id="joinEmail" placeholder="メールアドレス">

        <!-- 이메일 인증코드 발송 -->
        <button type="button" id="sendJoinCodeBtn" class="auth-btn">
            認証コードを送信
        </button>

        <!-- 이메일 인증코드 입력 -->
        <input type="text" id="joinAuthCode" placeholder="認証コードを入力">

        <!-- 이메일 인증코드 확인 -->
        <button type="button" id="verifyJoinCodeBtn" class="auth-btn">
            認証コードを確認
        </button>

        <!-- 이메일 인증 결과 메시지 -->
        <div id="joinEmailAuthResult" class="find-result"></div>

        <!-- 비밀번호 -->
        <input type="password" id="joinPassword" placeholder="パスワード">

        <!-- 회원가입 -->
        <button id="joinBtn" class="auth-btn">会員登録</button>

        <div class="auth-links">
            <a href="/login.html">すでにアカウントをお持ちの方</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
